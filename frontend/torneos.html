<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos — Grand History</title>
    <link rel="stylesheet" href="torneos.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="Raquetas.png" alt=""><span>Grand History</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneos.html" class="active">Torneos</a></li>
                <li><a href="partidos.html">Partidos</a></li>
                <li><a href="jugadores.html">Jugadores</a></li>
                <li><a href="entrenadores.html">Entrenadores</a></li>
                <li><a href="arbitros.html">Árbitros</a></li>
            </ul>
            <div class="role-switcher" id="sesion-navbar"></div>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h2>Torneos y Ediciones</h2>
            <p>Consulta los detalles de cada edición del Grand Slam, sus resultados y composición de partidos.</p>
        </section>

        <section class="search-section">
            <h3>Buscar Torneo</h3>
            <form class="search-form">
                <select id="filtro-anio">
                    <option value="">Seleccionar año...</option>
                </select>
                <select id="filtro-torneo">
                    <option value="">Seleccionar torneo...</option>
                </select>
                <button type="button" id="btn-buscar-torneo">Buscar</button>
            </form>
        </section>

        <section class="card">
            <h4>Resultados del Torneo</h4>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Modalidad</th>
                            <th>Campeón</th>
                            <th>Finalista</th>
                            <th>Dinero repartido</th>
                        </tr>
                    </thead>
                    <tbody id="torneos-tbody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="permisos.js"></script>
    <script src="scriptTorneo.js"></script>
</body>
</html>
