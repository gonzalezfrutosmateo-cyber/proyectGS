<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos — Grand History</title>
    <link rel="stylesheet" href="torneos.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Grand History</a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneos.html" class="active">Torneos</a></li>
                <li><a href="partidos.html">Partidos</a></li>
                <li><a href="jugadores.html">Jugadores</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h2>Torneos y Ediciones</h2>
            <p>Consulta los detalles de cada edición del Grand Slam, sus resultados y composición de partidos.</p>
        </section>

        <section class="search-section">
            <h3>Buscar Torneo</h3>
            <form class="search-form">
                <select>
                    <option value="">Seleccionar año...</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                </select>
                <select>
                    <option value="">Seleccionar torneo...</option>
                    <option value="wimbledon">Wimbledon</option>
                    <option value="us-open">US Open</option>
                    <option value="roland-garros">Roland Garros</option>
                    <option value="australian-open">Australian Open</option>
                </select>
                <button type="button">Buscar</button>
            </form>
        </section>

        <section class="card">
            <h4>Partidos del Torneo</h4>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Modalidad</th>
                            <th>Fase</th>
                            <th>Jugador 1</th>
                            <th>Jugador 2</th>
                            <th>Resultado</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
